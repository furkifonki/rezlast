name: iOS build and TestFlight

# Run manually from GitHub: Actions > "iOS build and TestFlight" > Run workflow
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app"
        type: choice
        options:
          - mobile-app
          - admin-app
        default: mobile-app
      build_id:
        description: "Optional: an existing EAS build ID to send to TestFlight without building again"
        type: string
        required: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Check Expo login
        run: eas whoami

      - name: Install dependencies
        run: npm ci

      # New build on Expo servers, then automatic send to App Store Connect (TestFlight).
      # Supabase keys come from the EAS "production" environment variables on expo.dev.
      - name: Build and submit to TestFlight
        if: ${{ inputs.build_id == '' }}
        run: |
          set -o pipefail
          eas build --platform ios --profile production --non-interactive --auto-submit --no-wait 2>&1 | tee eas.log || {
            tail -n 9 eas.log | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          grep -Eo 'https://expo.dev/[^ ]+' eas.log | sort -u | while read -r url; do echo "::notice::$url"; done

      # Send an existing build to TestFlight (waits for the build to finish first).
      - name: Submit existing build to TestFlight
        if: ${{ inputs.build_id != '' }}
        run: |
          set -o pipefail
          eas submit --platform ios --profile production --id "${{ inputs.build_id }}" --non-interactive --wait 2>&1 | tee eas.log || {
            tail -n 9 eas.log | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          tail -n 5 eas.log | sed -e 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r line; do echo "::notice::$line"; done
